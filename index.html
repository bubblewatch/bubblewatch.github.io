<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bubble Watch — AI Bubble Risk Monitor</title>
<meta name="description" content="Weekly tracking of AI bubble risk via a battery of leading indicators across 6 categories, read on two axes: bubble maturity (stage) and rupture proximity (trigger), pattern-matched against historical tops." />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #FBF7F0;
    --ink: #1A1815;
    --red: #7C1D1D;
    --yellow: #A8761A;
    --green: #1F4D2C;
    --muted: #666;
    --warm: #3A3530;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Lora", "Georgia", serif;
    min-height: 100vh;
  }
  .mono { font-family: "IBM Plex Mono", monospace; }
  .display { font-family: "Playfair Display", serif; }
  .container { max-width: 1280px; margin: 0 auto; padding: clamp(20px, 4vw, 48px); }

  /* Masthead */
  header.masthead { border-bottom: 3px double var(--ink); padding-bottom: 20px; margin-bottom: 32px; }
  .masthead-row { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; }
  .kicker { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.3em; color: var(--red); margin-bottom: 8px; }
  h1.title { font-family: "Playfair Display", serif; font-size: clamp(36px, 6vw, 64px); font-weight: 900; line-height: 1.05; margin: 0; letter-spacing: -0.02em; }
  h1.title em { font-style: italic; font-weight: 400; }
  .issue-meta { text-align: right; font-family: "IBM Plex Mono", monospace; font-size: 12px; line-height: 1.8; }
  .issue-meta .small { margin-top: 8px; color: var(--muted); }

  /* Headline */
  .headline { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 32px; align-items: stretch; margin-bottom: 48px; }
  @media (max-width: 720px) { .headline { grid-template-columns: 1fr; } }
  .big-number {
    background: var(--ink); color: var(--bg); padding: 32px;
    display: flex; flex-direction: column; justify-content: space-between; min-height: 320px;
  }
  .big-number .label { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.2em; opacity: 0.6; }
  .big-number .value {
    font-family: "Playfair Display", serif; font-size: clamp(80px, 14vw, 144px);
    font-weight: 900; line-height: 0.9; letter-spacing: -0.04em;
  }
  .big-number .value sup { font-size: 0.4em; vertical-align: super; }
  .big-number .breakdown { font-family: "IBM Plex Mono", monospace; font-size: 12px; margin-top: 12px; opacity: 0.7; line-height: 1.6; }
  .big-number .footer { border-top: 1px solid rgba(251,247,240,0.2); padding-top: 12px; font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: 0.15em; opacity: 0.5; }

  .verdict { display: flex; flex-direction: column; justify-content: space-between; }
  .verdict .label { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.2em; color: var(--red); margin-bottom: 12px; }
  .verdict h2 { font-family: "Playfair Display", serif; font-size: clamp(28px, 4vw, 42px); font-weight: 700; line-height: 1.15; margin: 0 0 16px 0; letter-spacing: -0.01em; }
  .verdict p { font-size: 17px; line-height: 1.7; margin: 0; color: var(--warm); }
  .verdict p + p { margin-top: 0.75em; }
  .verdict p strong { font-weight: 700; color: var(--ink); }
  .verdict p em { font-style: italic; }
  .verdict .footnote { margin-top: 24px; border-top: 1px solid var(--ink); padding-top: 16px; font-family: "IBM Plex Mono", monospace; font-size: 11px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }

  /* Trend */
  section.trend { margin-bottom: 48px; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); padding: 24px 0; }
  .trend-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; flex-wrap: wrap; gap: 8px; }
  .trend-header h3 { font-family: "Playfair Display", serif; font-size: 22px; font-weight: 700; margin: 0; }
  .trend-header h3 em { font-style: italic; font-weight: 400; font-size: 0.7em; }
  .trend-legend { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; }
  #trend-chart-wrap { position: relative; height: 220px; }

  /* Credit spread small multiples (series magnitudes differ ~10x, so independent y axes) */
  .credit-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  @media (max-width: 720px) { .credit-grid { grid-template-columns: 1fr; } }
  .credit-label { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .credit-label b { color: var(--ink); letter-spacing: 0.08em; }
  .credit-chart-wrap { position: relative; height: 180px; }

  /* Categories */
  section.category { margin-bottom: 40px; }
  .category-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; border-bottom: 2px solid var(--ink); padding-bottom: 8px; flex-wrap: wrap; gap: 8px; }
  .category-header .titles { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .category-header h3 { font-family: "Playfair Display", serif; font-size: 28px; font-weight: 900; margin: 0; letter-spacing: -0.01em; }
  .category-header .sub { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.2em; color: var(--muted); }
  .category-header .counts { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted); }
  .counts .red { color: var(--red); }
  .counts .yellow { color: var(--yellow); }

  .indicator-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 16px; }
  article.indicator { border: 1px solid var(--ink); background: var(--bg); padding: 18px; position: relative; display: flex; flex-direction: column; gap: 10px; }
  article.indicator .status-bar { position: absolute; top: 0; left: 0; width: 100%; height: 4px; }
  .status-bar.red { background: var(--red); }
  .status-bar.yellow { background: var(--yellow); }
  .status-bar.green { background: var(--green); }
  article.indicator .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-top: 4px; }
  article.indicator .name { font-family: "Lora", serif; font-size: 16px; font-weight: 600; line-height: 1.25; }
  .badge { font-family: "IBM Plex Mono", monospace; font-size: 10px; padding: 4px 8px; letter-spacing: 0.1em; font-weight: 600; white-space: nowrap; color: var(--bg); }
  .badge.red { background: var(--red); }
  .badge.yellow { background: var(--yellow); }
  .badge.green { background: var(--green); }
  article.indicator .number { font-family: "Playfair Display", serif; font-size: 38px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
  article.indicator .number .unit { font-size: 0.5em; font-weight: 400; margin-left: 2px; }
  article.indicator .note { font-family: "Lora", serif; font-size: 13px; color: var(--warm); line-height: 1.55; font-style: italic; }
  article.indicator .meta { border-top: 1px dashed #999; padding-top: 8px; font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px; }
  article.indicator.stale::after { content: "STALE"; position: absolute; top: 8px; right: 8px; font-family: "IBM Plex Mono", monospace; font-size: 9px; padding: 2px 5px; background: #ddd; color: #555; letter-spacing: 0.1em; }
  .carry-tag { background: #E8E0D0; color: #7a5c10; padding: 1px 4px; font-weight: 600; }
  .static-tag { background: #F0D9D9; color: #7C1D1D; padding: 1px 4px; font-weight: 600; }

  /* Two-axis read (stage x trigger) */
  section.axes { margin-bottom: 48px; border: 1px solid var(--ink); padding: 20px; }
  .axes-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
  .axes-header h3 { font-family: "Playfair Display", serif; font-size: 22px; font-weight: 700; margin: 0; }
  .axes-header h3 em { font-style: italic; font-weight: 400; font-size: 0.7em; }
  .axes-header .now { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--muted); letter-spacing: 0.1em; }
  .axes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 720px) { .axes-grid { grid-template-columns: 1fr; } }
  .axis-label { display: flex; justify-content: space-between; align-items: baseline; font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.15em; color: var(--muted); margin-bottom: 8px; gap: 8px; flex-wrap: wrap; }
  .axis-label .axis-score { font-weight: 600; color: var(--ink); letter-spacing: 0.05em; }
  .axis-bar { position: relative; height: 40px; border: 1px solid var(--ink); display: flex; }
  .axis-bar .zone { height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px; color: #FBF7F0; min-width: 0; padding: 2px; text-align: center; }
  .axis-bar .zone.t-green { background: #1F4D2C; } .axis-bar .zone.t-yellow { background: #A8761A; } .axis-bar .zone.t-orange { background: #C25E2A; } .axis-bar .zone.t-red { background: #7C1D1D; }
  .axis-bar .zone-label { font-size: 10px; font-weight: 700; line-height: 1.1; font-family: "Lora", serif; }
  .axis-bar .zone-pct { font-family: "IBM Plex Mono", monospace; font-size: 9px; opacity: 0.85; }
  .axis-bar .marker { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--ink); transform: translateX(-50%); }
  .axis-bar .marker::after { content: ""; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 7px solid var(--ink); }
  .axis-desc { margin-top: 8px; font-family: "Lora", serif; font-size: 12px; color: var(--warm); font-style: italic; line-height: 1.5; }
  .similarity-row { margin-top: 18px; border-top: 1px dashed #999; padding-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-family: "IBM Plex Mono", monospace; font-size: 11px; }
  .similarity-row .sim-label { letter-spacing: 0.15em; color: var(--muted); margin-right: 4px; }
  .sim-chip { border: 1px solid var(--ink); padding: 3px 8px; }
  .sim-chip b { font-weight: 700; }
  .sim-chip.top { background: var(--ink); color: var(--bg); }
  .momentum-row { margin-top: 10px; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--warm); }
  .momentum-row .worse { color: var(--red); } .momentum-row .better { color: var(--green); }

  /* WoW */
  section.wow { margin-bottom: 40px; background: var(--ink); color: var(--bg); padding: 28px; }
  section.wow .label { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.2em; opacity: 0.6; margin-bottom: 16px; }
  .wow-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 20px; }
  .wow-item .tag { font-family: "IBM Plex Mono", monospace; font-size: 10px; margin-bottom: 4px; }
  .wow-item .tag.up { color: var(--yellow); }
  .wow-item .tag.down { color: #7DB37C; }
  .wow-item .tag.flat { color: #999; }
  .wow-item .text { font-family: "Lora", serif; font-size: 14px; line-height: 1.6; }

  /* Watch */
  section.watch { margin-bottom: 48px; }
  section.watch h3 { font-family: "Playfair Display", serif; font-size: 24px; font-weight: 700; margin: 0 0 16px 0; border-bottom: 1px solid var(--ink); padding-bottom: 8px; }
  section.watch h3 em { font-style: italic; font-weight: 400; }
  .watch-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; }
  .watch-item { border-left: 3px solid var(--red); padding-left: 14px; }
  .watch-item .icon { font-family: "Playfair Display", serif; font-size: 20px; font-weight: 700; color: var(--red); margin-bottom: 4px; }
  .watch-item .title { font-family: "Lora", serif; font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .watch-item .desc { font-family: "Lora", serif; font-size: 13px; line-height: 1.6; color: var(--warm); }

  /* Footer */
  footer.method { border-top: 3px double var(--ink); padding-top: 24px; margin-top: 48px; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--muted); line-height: 1.7; }
  .method-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 24px; }
  .method-grid h4 { color: var(--ink); font-weight: 600; margin: 0 0 6px 0; font-family: inherit; font-size: 11px; }
  .lang-switch { font-family: "IBM Plex Mono", monospace; font-size: 11px; }
  .lang-switch a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--ink); padding-bottom: 1px; }

  /* Loading state */
  .loading { padding: 80px 0; text-align: center; font-family: "IBM Plex Mono", monospace; color: var(--muted); }
  .error { padding: 40px; background: #fee; border-left: 4px solid var(--red); margin: 32px 0; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--red); }
</style>
</head>
<body>
<div class="container" id="root">
  <div class="loading">Loading data...</div>
</div>

<script>
const CATEGORY_ORDER = [
  { key: 'valuation',        en: 'Valuation',        sub: 'VALUATION' },
  { key: 'capital',          en: 'Capital',          sub: 'CAPITAL' },
  { key: 'market_structure', en: 'Market Structure', sub: 'MARKET STRUCTURE' },
  { key: 'credit',           en: 'Credit',           sub: 'CREDIT' },
  { key: 'fundamentals',     en: 'Fundamentals',     sub: 'FUNDAMENTALS' },
  { key: 'macro',            en: 'Macro',            sub: 'MACRO' }
];

const VERDICT_TRANSLATIONS = {
  '系统性顶部信号': 'Systemic Top Signal',
  '系统性顶部': 'Systemic Top',
  '高风险预警': 'High Risk Alert',
  '中度警戒': 'Moderate Caution',
  '观察期': 'Observation'
};

const WATCH_LIST = [
  { icon: '①', title: 'Hyperscaler Capex Guidance', desc: 'Any Mag7 cutting current-year capex guidance at next earnings → RED. A structural top signal.' },
  { icon: '②', title: 'Fed Policy Path', desc: 'If oil/CPI forces the Fed to resume hiking, the setup mirrors 1999-2000 and the 1845 Railway Mania top.' },
  { icon: '③', title: 'CoreWeave / Nebius Credit', desc: 'Data-center ABS spreads widening 50bps+ is the earliest signal of vendor-financing chain stress.' },
  { icon: '④', title: 'OpenAI Auditor Disclosure', desc: 'Raised by Burry but unconfirmed. Any round-tripping investigation is an immediate RED.' },
  { icon: '⑤', title: 'Anthropic IPO Timing', desc: 'If the planned October IPO proceeds, the "AI IPO flood" indicator may flip to RED.' },
  { icon: '⑥', title: 'Mag7 Insider Selling', desc: 'Currently sporadic Thiel-style cases; watch whether it spreads to Mag7 executives broadly.' }
];

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Paragraphize verdict_desc: escape first, then convert **bold** (XSS-safe), split on blank lines;
// legacy format (2026-08-16 and earlier: one giant unbroken block) falls back to fallbackSplit
function renderVerdictDesc(text) {
  const t = (text == null ? '' : String(text)).trim();
  if (!t) return '';
  const paras = /\n\s*\n/.test(t) ? t.split(/\n\s*\n/) : fallbackSplit(t);
  return paras.filter(p => p.trim()).map(p => {
    let h = escapeHtml(p.trim()).replace(/\n/g, '<br/>');
    h = h.replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>');
    return `<p>${h}</p>`;
  }).join('');
}

function fallbackSplit(t) {
  // Tier 1: split at legacy section markers (Chinese fallback path via pickEn)
  const bySection = t.split(/(?=①|②|③|④|⑤|判读：|历史相似度：|分母提醒：|一句话：)/).filter(s => s.trim());
  if (bySection.length >= 2) return bySection;
  // Tier 2: group sentences into paragraphs (ASCII periods must be followed by whitespace to spare decimals)
  const sentences = t.match(/[\s\S]*?(?:[。！？]|[.!?](?=\s|$))[”』」)）]*/g);
  if (!sentences) return [t];
  const matchedLen = sentences.join('').length;
  if (matchedLen < t.length) sentences.push(t.slice(matchedLen));
  const target = /[一-鿿]/.test(t) ? 400 : 600;
  const paras = [];
  let cur = '';
  for (const s of sentences) {
    cur += s;
    if (cur.length >= target) { paras.push(cur); cur = ''; }
  }
  if (cur.trim()) paras.push(cur);
  return paras.length ? paras : [t];  // Tier 3: return as-is, same as old behavior
}

function statusBadge(status) {
  const map = { red: '● RED', yellow: '◐ YELLOW', green: '○ GREEN' };
  return `<span class="badge ${status}">${map[status] || status}</span>`;
}

function translateVerdict(zh) {
  return VERDICT_TRANSLATIONS[zh] || zh;
}

// Fallback chain for bilingual fields: prefer English, fall back to Chinese
function pickEn(en, zh) {
  return (en && en.trim()) ? en : zh;
}

const TIER_FROM_LABEL_ZH = { '系统性顶部信号': 'top', '系统性顶部': 'top', '高风险预警': 'alert', '中度警戒': 'caution', '观察期': 'observation' };
const TIER_LABEL_EN = { observation: 'Observation', caution: 'Moderate Caution', alert: 'High Risk Alert', top: 'Systemic Top' };

function tierFromPct(p) {
  if (p >= 60) return 'top';
  if (p >= 40) return 'alert';
  if (p >= 25) return 'caution';
  return 'observation';
}

function render(data, credit) {
  const s = data.summary;
  const indicators = data.indicators;
  const issueNo = String(data.issue_number).padStart(3, '0');
  const headlineColor = s.red_pct >= 60 ? '#E63946' : s.red_pct >= 40 ? '#E89B3C' : s.red_pct >= 25 ? '#F1C232' : 'var(--bg)';
  const verdictLabelEn = pickEn(s.verdict_label_en, translateVerdict(s.verdict_label));
  const verdictDescEn = pickEn(s.verdict_desc_en, s.verdict_desc);

  // Override detection: compare raw tier (from red_pct) to effective tier (from verdict_label)
  const baseTier = tierFromPct(s.red_pct);
  const effTier = TIER_FROM_LABEL_ZH[s.verdict_label] || baseTier;
  const overrideActive = effTier !== baseTier;

  const root = document.getElementById('root');
  root.innerHTML = `
    <header class="masthead">
      <div class="masthead-row">
        <div>
          <div class="kicker">${s.total_indicators} INDICATORS · UPDATED EVERY MONDAY</div>
          <h1 class="title">Bubble Watch<br/><em>AI Edition</em></h1>
        </div>
        <div class="issue-meta">
          <div>ISSUE NO. ${issueNo}</div>
          <div>${escapeHtml(data.as_of_date)}</div>
          <div class="small">${s.total_indicators} INDICATORS · ${CATEGORY_ORDER.length} CATEGORIES</div>
        </div>
      </div>
    </header>

    <section class="headline">
      <div class="big-number">
        <div class="label">RISK TEMPERATURE · RED LIGHT RATIO</div>
        <div>
          <div class="value" style="color:${headlineColor}">${s.red_pct.toFixed(1)}<sup>%</sup></div>
          <div class="breakdown">
            ${s.red_count} red / ${s.yellow_count} yellow / ${s.green_count} green<br/>
            Tiers: 25% yellow / 40% orange / 60% red${overrideActive ? `<br/>Raw tier ${TIER_LABEL_EN[baseTier]} · Override → ${escapeHtml(verdictLabelEn)}` : ''}
          </div>
        </div>
        <div class="footer">WEIGHTED RISK SCORE: ${s.weighted_risk_score.toFixed(1)}%</div>
      </div>
      <div class="verdict">
        <div>
          <div class="label">THIS WEEK'S VERDICT</div>
          <h2>${escapeHtml(verdictLabelEn)}</h2>
          ${renderVerdictDesc(verdictDescEn)}
        </div>
        <div class="footnote">
          <span>Issue ${issueNo} · ${escapeHtml(data.as_of_date)}</span>
          <span>Reference: 2000-03 (CAPE 44.19, NDX -78%)</span>
        </div>
      </div>
    </section>

    ${(s.stage_score != null && s.trigger_score != null) ? `
    <section class="axes">
      <div class="axes-header">
        <h3>Two-Axis Read <em>· Stage × Trigger</em></h3>
        <div class="now">BUBBLE MATURITY ${s.stage_score.toFixed(0)} · RUPTURE PROXIMITY ${s.trigger_score.toFixed(0)}</div>
      </div>
      <div class="axes-grid">
        <div class="axis-block">
          <div class="axis-label"><span>BUBBLE MATURITY · STAGE</span><span class="axis-score">${s.stage_score.toFixed(1)} · ${escapeHtml(pickEn(s.stage_label_en, s.stage_label))}</span></div>
          <div class="axis-bar">
            <div class="zone t-green" style="flex:30"><span class="zone-label">Displacement</span><span class="zone-pct">0–30</span></div>
            <div class="zone t-yellow" style="flex:20"><span class="zone-label">Boom</span><span class="zone-pct">30–50</span></div>
            <div class="zone t-orange" style="flex:20"><span class="zone-label">Euphoria</span><span class="zone-pct">50–70</span></div>
            <div class="zone t-red" style="flex:30"><span class="zone-label">Mania</span><span class="zone-pct">≥70</span></div>
            <div class="marker" style="left:${Math.min(Math.max(s.stage_score, 0.5), 99.5)}%"></div>
          </div>
          <div class="axis-desc">Slow variables — valuation, capital structure, issuance heat, narrative. Answers "how big is the bubble"; can stay red for years.</div>
        </div>
        <div class="axis-block">
          <div class="axis-label"><span>RUPTURE PROXIMITY · TRIGGER</span><span class="axis-score">${s.trigger_score.toFixed(1)} · ${escapeHtml(pickEn(s.trigger_label_en, s.trigger_label))}</span></div>
          <div class="axis-bar">
            <div class="zone t-green" style="flex:25"><span class="zone-label">Fuse Unlit</span><span class="zone-pct">0–25</span></div>
            <div class="zone t-yellow" style="flex:20"><span class="zone-label">Sparks</span><span class="zone-pct">25–45</span></div>
            <div class="zone t-orange" style="flex:20"><span class="zone-label">Fuse Lit</span><span class="zone-pct">45–65</span></div>
            <div class="zone t-red" style="flex:35"><span class="zone-label">Unwinding</span><span class="zone-pct">≥65</span></div>
            <div class="marker" style="left:${Math.min(Math.max(s.trigger_score, 0.5), 99.5)}%"></div>
          </div>
          <div class="axis-desc">Fast variables — credit spreads, breadth, insiders, compute pricing, private marks. Answers "is the fuse lit".</div>
        </div>
      </div>
      ${(s.similarity && s.similarity.length) ? `
      <div class="similarity-row">
        <span class="sim-label">HISTORICAL ANALOG</span>
        ${s.similarity.map((x, i) => `<span class="sim-chip${i === 0 ? ' top' : ''}">${escapeHtml(x.period)} ${escapeHtml(pickEn(x.label_en, x.label_zh))} <b>${x.match_pct}%</b></span>`).join('')}
      </div>` : ''}
      ${s.momentum ? `<div class="momentum-row">This week's margin: <b class="worse">${s.momentum.deteriorated} deteriorated</b> · <b class="better">${s.momentum.improved} improved</b> (net ${s.momentum.net > 0 ? '+' : ''}${s.momentum.net})</div>` : ''}
    </section>` : ''}

    <section class="trend">
      <div class="trend-header">
        <h3>Red Light Ratio <em>· 8-Week Trend</em></h3>
        <div class="trend-legend">
          <span><span style="color:var(--red)">●</span> Red %</span>
          <span><span style="color:var(--yellow)">●</span> Risk Score</span>
          <span style="color:var(--muted)">Tiers: 25 / 40 / 60</span>
        </div>
      </div>
      <div id="trend-chart-wrap"><canvas id="trend-chart"></canvas></div>
    </section>

    ${creditSectionHtml(credit)}

    ${CATEGORY_ORDER.map(cat => {
      const items = indicators.filter(i => i.category === cat.key);
      if (!items.length) return '';
      const r = items.filter(i => i.status === 'red').length;
      const y = items.filter(i => i.status === 'yellow').length;
      return `
        <section class="category">
          <div class="category-header">
            <div class="titles">
              <h3>${cat.en}</h3>
              <span class="sub">${cat.sub}</span>
            </div>
            <div class="counts">
              ${items.length} indicators · <span class="red">${r} red</span> · <span class="yellow">${y} yellow</span>
            </div>
          </div>
          <div class="indicator-grid">
            ${items.map(ind => {
              const noteEn = pickEn(ind.note_en, ind.note);
              const valueEn = ind.value_display_en || ind.value_display || ind.value;
              const carried = !ind.stale && ind.as_of && data.as_of_date && ind.as_of < data.as_of_date;
              const staticTag = ind.suspect_static ? ` <span class="static-tag">${ind.static_weeks ? 'UNCHANGED x' + ind.static_weeks : 'STATIC?'}</span>` : '';
              return `
              <article class="indicator${ind.stale ? ' stale' : ''}">
                <div class="status-bar ${ind.status}"></div>
                <div class="head">
                  <div>
                    <div class="name">${escapeHtml(ind.name_en)}</div>
                  </div>
                  ${statusBadge(ind.status)}
                </div>
                <div class="number">${escapeHtml(valueEn)}</div>
                <div class="note">${escapeHtml(noteEn)}</div>
                <div class="meta">
                  <span>${escapeHtml(ind.threshold_text_en || ind.threshold_text)}</span>
                  <span>${escapeHtml(ind.source_name)}${ind.as_of ? ' · ' + escapeHtml(ind.as_of) : ''}${carried ? ' <span class="carry-tag">CARRIED</span>' : ''}${staticTag}</span>
                </div>
              </article>
            `}).join('')}
          </div>
        </section>
      `;
    }).join('')}

    ${(data.wow_changes && data.wow_changes.length) ? `
      <section class="wow">
        <div class="label">WEEK-OVER-WEEK CHANGES</div>
        <div class="wow-grid">
          ${data.wow_changes.map(w => {
            const tagClass = w.type === 'status_upgrade' ? 'up' : w.type === 'status_downgrade' ? 'down' : 'flat';
            const tagLabel = w.type === 'status_upgrade' ? '▲ Risk Up' : w.type === 'status_downgrade' ? '▼ Risk Down' : '━ Flat';
            const noteEn = pickEn(w.note_en, w.note);
            return `
              <div class="wow-item">
                <div class="tag ${tagClass}">${tagLabel}</div>
                <div class="text">${escapeHtml(noteEn)}</div>
              </div>
            `;
          }).join('')}
        </div>
      </section>
    ` : ''}

    <section class="watch">
      <h3>What to Watch</h3>
      <div class="watch-grid">
        ${WATCH_LIST.map(w => `
          <div class="watch-item">
            <div class="icon">${w.icon}</div>
            <div class="title">${escapeHtml(w.title)}</div>
            <div class="desc">${escapeHtml(w.desc)}</div>
          </div>
        `).join('')}
      </div>
    </section>

    <footer class="method">
      <div class="method-grid">
        <div>
          <h4>Methodology</h4>
          <div>${s.total_indicators} leading indicators across ${CATEGORY_ORDER.length} categories, read on two axes: STAGE (bubble maturity, slow variables — "how big is the bubble") and TRIGGER (rupture proximity, fast variables — "is the fuse lit"). Each indicator scores RED / YELLOW / GREEN (100/50/0) against historically-calibrated thresholds. The red light ratio is a risk thermometer, not a "probability of the top". Verdict tiers sit at 25/40/60; valuation + capital resonance, or stage ≥60 with trigger ≥50, forces an upgrade; downgrades need two consecutive weeks (hysteresis). The historical analog compares this week's indicator vector against four past tops, indicator by indicator.</div>
        </div>
        <div>
          <h4>Historical Calibration</h4>
          <div>In the 6-12 months before the 2000 dot-com top, the 1845 Railway Mania top, and the 1996 telecom bubble top, the same indicators flashed: insider selling, capex / FCF divergence, breadth deterioration, vendor financing, CEO hedging language.</div>
        </div>
        <div>
          <h4>Data Freshness</h4>
          <div>Most indicators refresh every Monday; each card shows its own as-of date, and cards older than the issue date are tagged CARRIED. The debt/capex ratio runs a weekly deal ledger with a full reconciliation every 28 days; survey-based indicators refresh quarterly. Failed sources are tagged STALE; cards whose underlying raw value has not changed (or not been re-observed) for several issues are tagged UNCHANGED xN as a manual-review prompt.</div>
        </div>
        <div>
          <h4>Disclaimer</h4>
          <div>Framework research, not investment advice. Thresholds may evolve. Issue ${issueNo} · ${escapeHtml(data.as_of_date)}. <span class="lang-switch">中文版: <a href="https://aibubble-cn.github.io" target="_blank">aibubble-cn.github.io</a></span></div>
        </div>
      </div>
    </footer>
  `;

  drawTrend(data);
  drawCreditTrend(credit);
}

// AI infra credit spread small multiples: data from credit_spread_history.json, rewritten weekly
// by the main repo's prefetch workflow. Missing/malformed file → whole section hidden (graceful degrade).
const CREDIT_PANELS = [
  { key: 'hy', canvas: 'credit-hy', title: 'HY OAS', desc: 'Broad high yield', thresholds: [{ v: 350, color: '#F1C232' }, { v: 500, color: '#E63946' }] },
  { key: 'ccc', canvas: 'credit-ccc', title: 'CCC OAS', desc: 'Neocloud rating tail', thresholds: [] },
  { key: 'ig', canvas: 'credit-ig', title: 'IG OAS', desc: 'Hyperscaler funding base', thresholds: [] }
];

function creditValid(credit) {
  return !!(credit && credit.series && CREDIT_PANELS.every(p => Array.isArray(credit.series[p.key]) && credit.series[p.key].length > 1));
}

function creditSectionHtml(credit) {
  if (!creditValid(credit)) return '';
  const lastDate = credit.series.hy[credit.series.hy.length - 1].date;
  return `
    <section class="trend">
      <div class="trend-header">
        <h3>AI Infra Credit Spreads <em>· 1-Year · FRED Daily</em></h3>
        <div class="trend-legend">
          <span>Latest obs ${escapeHtml(lastDate)}</span>
          <span style="color:var(--muted)">HY thresholds: 350 yellow / 500 red</span>
        </div>
      </div>
      <div class="credit-grid">
        ${CREDIT_PANELS.map(p => {
          const pts = credit.series[p.key];
          const last = pts[pts.length - 1];
          const prev = pts[Math.max(0, pts.length - 6)]; // ~5 trading days ago
          const d = last.bps - prev.bps;
          return `<div>
            <div class="credit-label"><b>${p.title}</b><span>${p.desc} · ${last.bps}bp (5d ${d >= 0 ? '+' : ''}${d})</span></div>
            <div class="credit-chart-wrap"><canvas id="${p.canvas}"></canvas></div>
          </div>`;
        }).join('')}
      </div>
    </section>`;
}

function drawCreditTrend(credit) {
  if (!creditValid(credit)) return;
  CREDIT_PANELS.forEach(p => {
    const ctx = document.getElementById(p.canvas);
    if (!ctx) return;
    const pts = credit.series[p.key];
    const labels = pts.map(x => x.date);
    const datasets = [{
      label: p.title,
      data: pts.map(x => x.bps),
      borderColor: '#7C1D1D',
      backgroundColor: '#7C1D1D',
      borderWidth: 2,
      tension: 0.3,
      pointRadius: 0,
      pointHitRadius: 6
    }].concat(p.thresholds.map(th => ({
      label: String(th.v),
      data: labels.map(() => th.v),
      borderColor: th.color,
      backgroundColor: th.color,
      borderWidth: 1,
      borderDash: [4, 4],
      pointRadius: 0,
      pointHitRadius: 0
    })));
    new Chart(ctx, {
      type: 'line',
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#1A1815',
            titleFont: { family: 'IBM Plex Mono' },
            bodyFont: { family: 'IBM Plex Mono' },
            filter: item => item.datasetIndex === 0,
            callbacks: { label: item => ' ' + item.parsed.y + ' bps' }
          }
        },
        scales: {
          x: {
            ticks: {
              font: { family: 'IBM Plex Mono', size: 10 }, color: '#1A1815',
              maxTicksLimit: 5, maxRotation: 0,
              callback: function (v) { return String(this.getLabelForValue(v)).slice(0, 7); }
            },
            grid: { display: false }
          },
          y: {
            ticks: { font: { family: 'IBM Plex Mono', size: 10 }, color: '#1A1815', maxTicksLimit: 6, callback: v => v + 'bp' },
            grid: { color: 'rgba(0,0,0,0.05)' }
          }
        }
      }
    });
  });
}

function drawTrend(data) {
  const seed = data.history_seed || [];
  if (!seed.length) return;
  const ctx = document.getElementById('trend-chart');
  if (!ctx) return;
  new Chart(ctx, {
    type: 'line',
    data: {
      labels: seed.map(s => s.week),
      datasets: [
        {
          label: 'Red %',
          data: seed.map(s => s.red_pct),
          borderColor: '#7C1D1D',
          backgroundColor: '#7C1D1D',
          borderWidth: 2.5,
          tension: 0.3,
          pointRadius: 4
        },
        {
          label: 'Risk Score',
          data: seed.map(s => s.risk_score),
          borderColor: '#A8761A',
          backgroundColor: '#A8761A',
          borderWidth: 1.5,
          borderDash: [3, 3],
          tension: 0.3,
          pointRadius: 3
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1A1815',
          titleFont: { family: 'IBM Plex Mono' },
          bodyFont: { family: 'IBM Plex Mono' }
        }
      },
      scales: {
        x: { ticks: { font: { family: 'IBM Plex Mono', size: 11 }, color: '#1A1815' }, grid: { display: false } },
        y: {
          min: 0, max: 70,
          ticks: { font: { family: 'IBM Plex Mono', size: 11 }, color: '#1A1815', callback: v => v + '%' },
          grid: { color: 'rgba(0,0,0,0.05)' }
        }
      }
    }
  });
}

async function load() {
  try {
    // credit JSON is optional: on 404/parse failure pass null and the section hides itself
    const BASE = 'https://raw.githubusercontent.com/crystal-xiaoxiao/ai-bubble-monitor/main/docs/data/';
    const [latestRes, creditRes] = await Promise.allSettled([
      fetch(BASE + 'latest.json?t=' + Date.now()),
      fetch(BASE + 'credit_spread_history.json?t=' + Date.now())
    ]);
    if (latestRes.status !== 'fulfilled') throw latestRes.reason;
    if (!latestRes.value.ok) throw new Error('HTTP ' + latestRes.value.status);
    const data = await latestRes.value.json();
    let credit = null;
    if (creditRes.status === 'fulfilled' && creditRes.value.ok) {
      credit = await creditRes.value.json().catch(() => null);
    }
    render(data, credit);
  } catch (e) {
    document.getElementById('root').innerHTML = `
      <div class="error">Failed to load data: ${escapeHtml(e.message)}<br>Check that data/latest.json exists.</div>
    `;
  }
}
load();
</script>
